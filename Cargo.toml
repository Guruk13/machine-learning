[package]
name = "flappy-bird"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.19"
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_warn"] }
burn = { version = "0.21", features = ["autodiff", "wgpu", "cubecl"], default-features = false }
rand = { version = "0.10.1", default-features = false, features = ["std", "std_rng", "thread_rng"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1.23.2", features = ["js"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.104", features = ["console"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1.23.2", features = ["js"] }
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
